<div class="space-y-5 text-[#131B2E]">
  
  <!-- Page Header -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
    <div>
      <h2 class="text-4xl font-black text-[#131B2E] tracking-tight m-0">Overview</h2>
      <p class="text-base font-medium text-[#505F76] m-0 mt-1">Welcome back. Here is what is happening today.</p>
    </div>
    <button 
      type="button" 
      class="bg-[#800A20] text-white px-6 py-3 rounded-xl font-bold text-base flex items-center gap-2.5 hover:bg-[#630617] transition-all shadow-sm border-0 cursor-pointer active:scale-95 flex-shrink-0"
    >
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      Export Report
    </button>
  </div>

  <!-- Skeleton Loading View -->
  @if (isLoading()) {
    <mfe-dashboard-skeleton></mfe-dashboard-skeleton>
  } @else {

    <!-- TDS TabSet Component with Exact Active Styling -->
    <tds-tabset class="custom-dashboard-tabs">

      <!-- Tab 1: Overview Component -->
      <tds-tab title="Overview">
        <mfe-overview-tab 
          [selectedFilter]="selectedFilter()" 
          [projectsData]="projectsData()" 
          (filterChange)="setFilter($event)">
        </mfe-overview-tab>
      </tds-tab>

      <!-- Tab 2: Performance Component -->
      <tds-tab title="Performance">
        <mfe-performance-tab 
          [conversionFilter]="conversionFilter()" 
          [teamPerformanceData]="teamPerformanceData()" 
          (conversionFilterChange)="setConversionFilter($event)">
        </mfe-performance-tab>
      </tds-tab>

      <!-- Tab 3: Activity Component -->
      <tds-tab title="Activity">
        <mfe-activity-tab 
          [activityFilter]="activityFilter()" 
          [activityLogsData]="activityLogsData()" 
          (activityFilterChange)="setActivityFilter($event)">
        </mfe-activity-tab>
      </tds-tab>

    </tds-tabset>
  }

</div>
