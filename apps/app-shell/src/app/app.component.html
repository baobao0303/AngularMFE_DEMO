@if (isLoading()) {
<!-- Full-screen opaque overlay spinner covering the entire page -->
<div class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-[#FAF8FF]">
  <div class="flex flex-col items-center gap-3 p-6 rounded-2xl bg-white shadow-xl border border-slate-100">
    <tds-spinner color="error" class="h-10 w-10"></tds-spinner>
  </div>
</div>
}

@if (isAuthRoute()) {
<router-outlet></router-outlet>
} @else {
<div class="flex h-screen w-full overflow-hidden bg-[#FAF8FF] font-sans text-[#131B2E]">

  <!-- Sidebar Navigation Component -->
  <app-sidebar [collapsed]="collapsed()" (toggleSidebar)="toggleSidebar()" (logout)="logout()"></app-sidebar>

  <!-- Main Content Layout Area -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

    <!-- Top Navigation Header Component -->
    <app-header (toggleSidebar)="toggleSidebar()" (logout)="logout()"></app-header>

    <!-- Main Dynamic Route Viewport -->
    <main class="flex-1 overflow-y-auto px-4 py-5 md:px-6 md:py-5 w-full min-w-0">
      <div class="w-full min-w-0">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
}
