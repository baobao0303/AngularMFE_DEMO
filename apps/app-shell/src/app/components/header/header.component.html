<!-- Top Navigation Header -->
<header
  class="h-14 bg-white border-b border-[#C7C4D8]/40 px-5 flex items-center justify-between sticky top-0 z-30 shadow-xs">
  <div class="flex items-center gap-3">
    <!-- Mobile Sidebar Toggle -->
    <button type="button" (click)="onToggleSidebar()"
      class="md:hidden p-1.5 text-[#505F76] hover:bg-[#FAF8FF] rounded-lg border-0 bg-transparent cursor-pointer">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
  </div>

  <div class="flex items-center gap-4">
    @if (currentUser(); as user) {
    <div class="flex items-center gap-3">
      <span class="text-xs font-semibold text-[#131B2E] hidden sm:inline">{{ user.email }}</span>
      <button type="button" (click)="onLogout()"
        class="text-xs font-semibold text-[#800A20] hover:underline bg-transparent border-0 cursor-pointer">
        Sign Out
      </button>
    </div>
    } @else {
    <a routerLink="/auth/login" class="text-xs font-semibold text-[#800A20] hover:underline no-underline">
      Sign In
    </a>
    }
  </div>
</header>
